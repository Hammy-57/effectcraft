[package]
name = "effectcraft-effects"
description = "Effect registry (specs, parameters, categories) and CPU implementations of the effects library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# The integration tests are one binary (tests/effects/main.rs declares every tests/*.rs): one link
# instead of one per file. `cargo test -p effectcraft-effects --test effects sim_golden::`
autotests = false

[[test]]
name = "effects"
path = "tests/effects/main.rs"

[lints]
workspace = true

[dependencies]
effectcraft-geom = { workspace = true }
effectcraft-color = { workspace = true }
effectcraft-keyframe = { workspace = true }
effectcraft-project = { workspace = true }
effectcraft-raster = { workspace = true }
effectcraft-segment = { workspace = true }
effectcraft-track = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

